name: "Ошибка / Bug report"
description: "Расскажите, что не работает. Russian and English are welcome."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Пишите на русском или английском. Для примеров используйте вымышленные данные.
        Не прикладывайте личные записи, копии, пароли и ключи. Об уязвимостях
        сообщайте приватно через Security → Advisories.

        Russian and English are welcome. Use made-up records, not personal files,
        passwords, or keys. Report vulnerabilities privately through Security → Advisories.
  - type: textarea
    id: behavior
    attributes:
      label: "Что произошло / What happened?"
      description: "Опишите проблему; можно добавить снимок без личных данных. Describe the problem; a screenshot without private data can help."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Как должно быть / What did you expect?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Как повторить / Steps to reproduce"
      description: "Перечислите действия по порядку. List the steps in order."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Версия приложения / App version"
      placeholder: "1.1.0 или commit / or commit"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: "Android и устройство / Android and device"
      placeholder: "Android 16, модель или эмулятор / model or emulator"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: "Перед отправкой / Before sending"
      options:
        - label: "Личных данных, паролей, ключей и идентификаторов устройства нет. No private records, passwords, keys, or device identifiers are included."
          required: true
