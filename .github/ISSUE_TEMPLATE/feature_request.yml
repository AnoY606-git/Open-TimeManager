name: "Идея / Feature request"
description: "Предложите улучшение. Russian and English are welcome."
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "Какую задачу решаем / What problem would this solve?"
      description: "Расскажите, чего сейчас не хватает и кому это поможет. What is missing today, and who would benefit?"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: "Как это могло бы работать / How should it work?"
      description: "Опишите удобный для вас сценарий, без обязательных технических деталей. Describe the experience you want; technical details are optional."
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: "Нужны ли новые данные или разрешения / Any new data access or permissions?"
      options:
        - "Нет / No"
        - "Да, объясню ниже / Yes, explained below"
        - "Не знаю / Not sure"
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: "Что ещё стоит учесть / Anything else?"
      description: "Альтернативы, примеры или новые разрешения, если они нужны. Add alternatives, examples, or needed permissions. Не включайте личные данные / Do not include private data."
