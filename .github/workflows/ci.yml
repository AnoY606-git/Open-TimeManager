name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Policy, debug tests, lint, and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.20+101' # Adoptium SemVer for JDK 17.0.20.1+1
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          packages: ''
      - name: Install pinned Android packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Run repository policy tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Check repository policy
        run: python3 scripts/check_repository.py
      - name: Test, lint, compile instrumentation, and build
        run: >-
          ./gradlew --no-daemon
          :core:test
          :app:testDebugUnitTest
          :app:lintDebug
          :app:compileDebugAndroidTestKotlin
          :app:assembleDebug
      - name: Recheck policy and generated Room schemas
        run: |
          python3 scripts/check_repository.py
          git diff --exit-code -- app/schemas
      - name: Record APK checksums and source commit
        working-directory: app/build/outputs/apk
        run: |
          mkdir -p metadata
          sha256sum debug/app-debug.apk > metadata/SHA256SUMS
          git rev-parse HEAD > metadata/SOURCE_COMMIT.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-timemanager-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/metadata/SHA256SUMS
            app/build/outputs/apk/metadata/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test and lint reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-timemanager-unit-tests-and-lint-reports
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: Instrumentation API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.20+101' # Adoptium SemVer for JDK 17.0.20.1+1
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          packages: ''
      - name: Free disk space for emulator
        run: |
          # Hosted runners include several NDK versions; this project has no native build.
          sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Install compile SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload instrumentation reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-timemanager-instrumentation-api-${{ matrix.api-level }}-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
